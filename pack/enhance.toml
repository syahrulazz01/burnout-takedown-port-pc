# Burnout 3: Takedown (Takedawn v0.3.1) - Ultra-Low Preset (Intel Celeron / Low-End / No Vulkan 1.3)
# Native 480p (1x), nearest filter, sleep frame pacing (reduces CPU usage/heat).
# Press F1 (or Back+Start on controller) in-game to customize anytime.

[render]
scale = 1
shader_cache = true

[display]
widescreen = true
hdtv = "480p"

[present]
filter = "nearest"
aspect = "auto"
fullscreen = true
pacing = "sleep"
spin_lead = 0
