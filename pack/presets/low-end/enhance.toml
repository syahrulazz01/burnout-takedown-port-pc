# Burnout 3: Takedown (Takedawn v0.3.1) - LOW-END Preset (Intel Celeron / No Vulkan 1.3)
# Native 480p (1x), nearest filter, sleep frame pacing (reduces CPU usage/heat).

[render]
scale = 1
shader_cache = true

[display]
widescreen = true
hdtv = "480p"

[present]
filter = "nearest"
aspect = "auto"
fullscreen = true
pacing = "sleep"
spin_lead = 0
